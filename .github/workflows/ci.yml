name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"
  # This job compiles the workspace under thirteen different feature
  # combinations. Incremental artifacts are per-combination, are never reused
  # across them, and die with the runner -- they buy nothing here and cost
  # gigabytes (this directory reaches 16 GB in a developer checkout).
  CARGO_INCREMENTAL: 0
  # Full DWARF dominates the size of a debug test binary, and this crate's test
  # targets statically link sqlx, axum, reqwest and testcontainers.
  # `line-tables-only` keeps the file and line that the `RUST_BACKTRACE: 1`
  # above asks for, and drops the rest. The `test` profile inherits `dev`.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

  # Fail closed on the build-time github.com fetch. `utoipa-swagger-ui`'s build
  # script only reads this when the `vendored` feature is off, and Cargo.toml
  # keeps it on, so this value is printed to the build-script log and then
  # ignored -- which is exactly what makes the log line evidence. If `vendored`
  # is ever dropped, the build stops here with an unresolvable path instead of
  # quietly reaching the network again and reintroducing the run 34021441768
  # flake. Never point this at a real URL or a real file.
  SWAGGER_UI_DOWNLOAD_URL: file:///nonexistent/swagger-ui-must-come-from-the-vendored-feature.zip

jobs:
  windows-private-files:
    name: Windows private-file ACLs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with coverage support
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test native Windows private-file contracts
        shell: pwsh
        run: |
          cargo llvm-cov -p cli-framework --lib --no-default-features --features secrets --lcov --output-path private-files.lcov

      - name: Test full OIDC client cache and flow suite
        shell: pwsh
        run: |
          cargo test -p cli-framework-oidc --features client

      - name: Enforce touched-file line coverage
        shell: pwsh
        run: |
          $targets = @{
            "src/security/private_file.rs" = @{
              Lines = [System.Collections.Generic.HashSet[int]]::new()
              Hit = [System.Collections.Generic.HashSet[int]]::new()
            }
            "src/secrets/env_file.rs" = @{
              Lines = [System.Collections.Generic.HashSet[int]]::new()
              Hit = [System.Collections.Generic.HashSet[int]]::new()
            }
          }
          $current = $null
          foreach ($line in Get-Content private-files.lcov) {
            if ($line.StartsWith("SF:")) {
              $source = $line.Substring(3).Replace("\", "/")
              $current = $null
              foreach ($target in $targets.Keys) {
                if ($source.EndsWith($target)) { $current = $target; break }
              }
            } elseif ($null -ne $current -and $line -match '^DA:(\d+),(\d+)') {
              $lineNumber = [int]$Matches[1]
              $null = $targets[$current].Lines.Add($lineNumber)
              if ([int]$Matches[2] -gt 0) { $null = $targets[$current].Hit.Add($lineNumber) }
            }
          }
          $failed = $false
          foreach ($target in $targets.Keys) {
            $found = $targets[$target].Lines.Count
            $hit = $targets[$target].Hit.Count
            if ($found -eq 0) {
              Write-Error "$target was absent from the coverage report"
              $failed = $true
              continue
            }
            $percent = 100.0 * $hit / $found
            Write-Host ("{0}: {1}/{2} lines ({3:N2}%)" -f $target, $hit, $found, $percent)
            if (10 * $hit -le 9 * $found) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Upload Windows private-file coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-private-file-coverage
          path: private-files.lcov

  self-install:
    name: Self-install (${{ matrix.os }})
    # ADR 0080: `self install` / `uninstall` / `status`, the doctor checks and
    # the install.sh / install.ps1 templates touch PATH, rc files, the Windows
    # registry and running-binary replacement, so each OS runs them natively.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Unit and CLI tests
        run: cargo test --features self-install --test unit_self_install --test unit_self_update --test integration_self_install_cli

      # A "newer release" first (CFW_DEMO_VERSION is read at compile time),
      # set aside, then the current one the installer places.
      - name: Build the demo binaries
        shell: bash
        run: |
          CFW_DEMO_VERSION=99.0.0 cargo build --features self-install --bin cfw-self-install-demo
          mkdir -p target/newer
          cp target/debug/cfw-self-install-demo* target/newer/
          cargo build --features self-install --bin cfw-self-install-demo

      - name: install.sh end to end
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scripts/ci/self-install-e2e.sh target/debug/cfw-self-install-demo sh target/newer/cfw-self-install-demo
          if command -v dash >/dev/null 2>&1; then
            scripts/ci/self-install-e2e.sh target/debug/cfw-self-install-demo dash
          fi

      - name: install.ps1 end to end
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/ci/self-install-e2e.ps1 target\debug\cfw-self-install-demo.exe target\newer\cfw-self-install-demo.exe

  ci:
    name: Linux Check / Lint / Test
    runs-on: ubuntu-latest

    # First service container this repo has ever needed (spec 022): the
    # config-service's Postgres conformance suite
    # (tests/integration/config_service_postgres_conformance.rs) is
    # triggered purely by `DATABASE_URL` being set, which this job now
    # always does -- unlike the pre-existing `secrets_openbao_conformance.rs`
    # precedent (testcontainers-based, self-skips locally, never runs in
    # CI), this suite is meant to actually execute here. Postgres has native
    # GitHub Actions `services:` support, which is more reliable in CI than
    # Docker-in-Docker.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # A GitHub-hosted ubuntu runner starts with about 14 GB free on `/`, and
      # this job compiles the workspace under thirteen feature combinations on
      # top of a restored `target` cache -- cargo never garbage-collects, so the
      # tree only grows. Run 33944180133 exhausted the disk during the last
      # step and reported *no* failed step at all: the runner died while
      # writing its own diagnostic log, so the IOException surfaced only in the
      # check-run annotations while the step list looked clean. Deleting
      # toolchains this repo does not use buys back more room than any amount
      # of tuning the build, and is the standard remedy for it.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          echo "--- after ---"
          df -h /

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # `Cargo.lock` is gitignored here (.gitignore:8, normal for a library
          # crate) and this step runs before any cargo command, so nothing
          # matches the glob and `hashFiles` returns the EMPTY string -- the key
          # collapses to the constant `Linux-cargo-`. Every run is then an exact
          # hit on the primary key, and actions/cache skips the post-job save on
          # an exact hit. Run 34030714752 says so outright:
          #   key: Linux-cargo-
          #   Cache hit for: Linux-cargo-
          #   Cache hit occurred on the primary key Linux-cargo-, not saving cache.
          # so the entry was frozen at whatever the first successful job wrote
          # (~3902 MB) and could never pick up a dependency change. Hash the
          # manifests instead: they are committed, so they exist at checkout
          # time, and they change when the dependency set changes. Do not put
          # Cargo.lock back here unless it is committed.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Format check
        run: cargo fmt --all -- --check

      # `--workspace` is load-bearing, not tidiness: with `.` itself a member of
      # `[workspace] members`, cargo's default package selection is the
      # manifest's own package, so without it this step lints ONLY the root
      # crate and has never seen `cli-framework-oidc` or `cli-framework-macros`.
      - name: Clippy (workspace, all features)
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Audit
        run: cargo audit

      - name: Build release (all features)
        run: cargo build --all-features --release

      # `utoipa-swagger-ui`'s build script fetches its asset archive from
      # github.com unless the `vendored` feature is on, and a runner-network
      # blip there fails this job with a panic that names none of the code
      # under test (run 34021441768: `curl: (28) Failed to connect to
      # github.com port 443 after 135310 ms`; a plain re-run cleared it).
      # Cargo.toml enables `vendored` so the archive comes from crates.io
      # instead. The workflow-level `SWAGGER_UI_DOWNLOAD_URL` above makes a
      # regression fail closed; this step is what makes it legible.
      #
      # `cargo build` prints a build script's stdout only when the script
      # FAILS, so the green step above is NOT evidence that the download was
      # skipped -- the download usually succeeds, and when it does the log
      # says nothing at all. Cargo does persist that stdout next to the build
      # output, so read it back and fail if the vendored branch was not the
      # one taken.
      #
      # Must stay ahead of `Reclaim the release build tree`, which deletes the
      # directory this reads.
      - name: Assert the Swagger UI archive was vendored, not downloaded
        run: |
          # `target` is restored wholesale from actions/cache, so
          # `target/release/build` also holds fossil `utoipa-swagger-ui-<hash>`
          # directories left by older dependency resolutions, and those
          # legitimately record a download. Scanning every directory on disk is
          # therefore wrong -- run 34029460782 failed here on such a fossil
          # while the build under test was correctly vendored. Ask cargo which
          # OUT_DIR *this* build used instead of guessing: re-invoking it with
          # `--message-format=json` recompiles nothing (every unit is already
          # fresh) but still replays the `build-script-executed` message that
          # names the directory.
          json="${RUNNER_TEMP:-/tmp}/cargo-build-graph.json"
          cargo build --all-features --release --message-format=json > "$json"

          # `#utoipa-swagger-ui@` anchors on the package-id separator, so the
          # sibling `utoipa-swagger-ui-vendored` crate cannot match.
          out_dir=$(grep '"reason":"build-script-executed"' "$json" \
                    | grep -F '#utoipa-swagger-ui@' \
                    | sed -n 's/.*"out_dir":"\([^"]*\)".*/\1/p') || true
          count=$(printf '%s\n' "$out_dir" | grep -c .) || true
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one utoipa-swagger-ui build script in the release graph, found $count -- this assertion would be vacuous or ambiguous"
            exit 1
          fi

          output="$(dirname "$out_dir")/output"
          if [ ! -f "$output" ]; then
            echo "::error::cargo named $out_dir but $output does not exist -- nothing to assert against"
            exit 1
          fi
          echo "--- $output ---"
          cat "$output"
          if ! grep -qF 'using vendored Swagger UI' "$output"; then
            echo "::error::utoipa-swagger-ui resolved its archive from SWAGGER_UI_DOWNLOAD_URL instead of the vendored crate, which puts a live github.com fetch back in the build; re-add the 'vendored' feature to the utoipa-swagger-ui dependency in Cargo.toml"
            exit 1
          fi

      # Nothing downstream consumes these binaries -- the step above exists to
      # prove the all-features build compiles -- and an all-features release
      # tree is several gigabytes sitting beside the debug artifacts that every
      # test step below adds to.
      - name: Reclaim the release build tree
        run: |
          du -sh target/release || true
          rm -rf target/release
          df -h /

      - name: Test (default features)
        run: cargo test --verbose

      - name: Test (chat)
        run: cargo test --features chat --verbose

      - name: Test (mcp-server)
        run: cargo test --features mcp-server --verbose

      - name: Test (chat + mcp-server)
        run: cargo test --features "chat,mcp-server" --verbose

      # The telemetry unit + integration suites are gated behind the `telemetry`
      # feature (their targets also need api-server + testkit + derive; the MCP
      # span test needs mcp-server), so none of the combos above run them.
      #
      # Deliberately NOT scoped with `--test`. This step used to name three
      # targets while Cargo.toml declared twenty, and `cargo test --test <name>`
      # is silent about the ones it was not given: eighteen telemetry suites had
      # never executed here even once, and every pull request that added one
      # merged green without it. Enabling the feature union and letting cargo
      # select targets from `required-features` removes the list that drifts.
      # `tests/unit/telemetry_ci_targets.rs` fails if either half regresses.
      # `config` and `config-service` are named explicitly even though
      # `telemetry` already implies `config`: `unit_telemetry_ci_targets`
      # compares this list literally against each target's
      # `required-features`, so the workflow has to say what its targets
      # need rather than rely on a reader knowing the feature graph.
      # `config-service` is not cosmetic — `unit_telemetry_policy_governance`
      # needs `telemetry` *and* `config-service`, a combination no other step
      # enables, so before this it executed nowhere. It needs no database;
      # the three Postgres suites this list now also selects skip on an unset
      # `DATABASE_URL` and are covered for real by `Test (config-service)`.
      - name: Test (telemetry)
        run: >
          cargo test
          --features "telemetry,config,config-service,mcp-server,api-server,testkit,derive"
          --verbose

      - name: Integration tests (mcp-server)
        run: >
          cargo test
          --features mcp-server
          --test integration_mcp_http
          --test integration_mcp_axum_mount
          --verbose

      # `config` and `config-managed` are additive features exercised only by
      # the all-features clippy/build steps above, never actually `cargo
      # test`'d by any combo above — same gap the telemetry step exists to
      # close, closed the same way.
      - name: Test (config)
        run: cargo test --features config,testkit --verbose

      - name: Test (config-managed)
        run: cargo test --features config-managed,testkit --verbose

      # config-service (spec 022): DATABASE_URL points at the `postgres`
      # service container declared on this job above. The migration runner
      # (crate::config::service::postgres::migrations::run_migrations,
      # invoked from `connect_and_migrate`) creates every table itself the
      # first time a test connects -- there is no separate schema-creation
      # step here, and none is needed. Presence of DATABASE_URL is what
      # turns on the Postgres half of the conformance suite; the rest of
      # the config-service tests run unconditionally either way.
      - name: Test (config-service)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: cargo test --features config-service,testkit --verbose

      # Mirrors step 5b of `scripts/run-ci-tests.sh`, which has run this matrix
      # locally for a long time while this workflow ran none of it. Every
      # `cargo test` step above selects the ROOT package only -- `.` is itself a
      # `[workspace] members` entry, so cargo's default selection is this
      # manifest's own package -- and the crate's test targets are additionally
      # gated behind `required-features`. Net effect: not one of
      # cli-framework-oidc's test targets had ever run in CI, including the OIDC
      # token-validation and the PKCE/device-code suites, and the script that
      # claims to "replicate the exact test commands run in GitHub Actions CI"
      # was in fact a strict superset of it.
      #
      # `--all-features` is deliberately NOT used: it collapses the matrix into a
      # single build and would hide a feature that is broken on its own. Keep
      # these lines in step with 5b -- that script is the local parity gate
      # (CFW-0005) and the two drifting apart is the defect this step closes.
      - name: Test (cli-framework-oidc feature matrix)
        run: |
          cargo test -p cli-framework-oidc --features client --verbose
          cargo test -p cli-framework-oidc --features server --verbose
          cargo test -p cli-framework-oidc --features server,test-support --verbose
          cargo test -p cli-framework-oidc --features browser --verbose
          cargo test -p cli-framework-oidc --features client,server --verbose
          cargo build -p cli-framework-oidc --no-default-features --verbose
          cargo test -p cli-framework --no-default-features --features auth,testkit --verbose
          cargo test -p cli-framework --features auth,testkit --verbose

      # Unconditional: when the disk is the problem, the failing step is the
      # one that cannot write, which is rarely the one at fault. This puts the
      # number in the step log instead of leaving it to the annotations.
      - name: Report disk usage
        if: always()
        run: |
          df -h /
          du -sh target 2>/dev/null || true

  required-check:
    name: Check / Lint / Test
    if: ${{ always() }}
    needs: [ci, windows-private-files, self-install]
    runs-on: ubuntu-latest
    steps:
      - name: Require Linux, native Windows and self-install success
        env:
          LINUX_RESULT: ${{ needs.ci.result }}
          WINDOWS_RESULT: ${{ needs.windows-private-files.result }}
          SELF_INSTALL_RESULT: ${{ needs.self-install.result }}
        run: |
          if [[ "$LINUX_RESULT" != "success" || "$WINDOWS_RESULT" != "success" || "$SELF_INSTALL_RESULT" != "success" ]]; then
            echo "Linux result: $LINUX_RESULT"
            echo "Windows result: $WINDOWS_RESULT"
            echo "Self-install result: $SELF_INSTALL_RESULT"
            exit 1
          fi
