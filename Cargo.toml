[workspace]
resolver = "2"
members = [".", "cli-framework-macros", "cli-framework-oidc"]

[workspace.package]
edition = "2021"
rust-version = "1.83.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.52", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[package]
name = "cli-framework"
version = "0.5.8"
edition.workspace = true
rust-version.workspace = true
authors = ["CLI Framework Team"]
description = "A pure CLI framework with AI-powered command resolution and plugin system"
license = "Apache-2.0"
repository = "https://github.com/aroff/cli-framework"

[dependencies]
cli-framework-macros = { path = "cli-framework-macros", optional = true }
anyhow = "1.0"
regex = "1"
thiserror = "1.0"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["time"], optional = true }
reqwest = { workspace = true, features = ["json"] }
httpdate = "1.0"
tracing.workspace = true
opentelemetry = "0.31"
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter", "fmt"] }
clap = { version = "4.0", features = ["derive", "string"] }
toml = "1"
dirs = "5.0"
uuid.workspace = true
crossterm = "0.28"
ailoop-core = { git = "https://github.com/goailoop/ailoop.git", rev = "c9b70bcc0bd659823dc8ddf71d8571a8e011113b", default-features = false }

# Optional dependencies for CLI output utilities
comfy-table = { version = "7.0", optional = true }
indicatif = { version = "0.17", optional = true }

# Optional MCP server dependencies
# - transport-io: server-side stdio transport (Phase 2 rollout #50)
# - client: enabled so integration tests can exercise stdio-style transports without TCP
rmcp = { version = "1.6", features = ["server", "client", "transport-streamable-http-server", "transport-io"], optional = true }
axum = { version = "0.8", optional = true }
# `http` (not `axum`'s re-export) so the per-request identity seam's public
# signature (`&http::HeaderMap`) names a crate consumers can depend on directly.
http = { version = "1", optional = true }
# Optional API server dependencies
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.7", features = ["cors"], optional = true }
# `serde` (spec 023): `mutation_log.occurred_at` decodes to `chrono::DateTime<Utc>`
# (see the `sqlx-core`/`sqlx-postgres` `chrono` feature comment below) and is
# serialized directly onto the `/v1/admin/policy/{app}/{profile}/history`
# wire response — chrono's own `serde` feature is what provides that
# `Serialize`/`Deserialize` impl; nothing used it before spec 023 since
# `HeaderConfig` (the sole prior `DateTime<Utc>` consumer) is never
# (de)serialized itself.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"], optional = true }
# Optional MCP install dependency (aikit-sdk provides add_mcp_server and mcp_supported_agents)
aikit-sdk = { git = "https://github.com/goaikit/aikit.git", package = "aikit-sdk", rev = "eb50f2c5509d4345cab65af0f7faed012ab0e557", optional = true }
## Optional embedded agent dependency (used by `chat` feature)
aikit-agent = { git = "https://github.com/goaikit/aikit.git", package = "aikit-agent", rev = "eb50f2c5509d4345cab65af0f7faed012ab0e557", optional = true }
# Optional Swagger UI dependency for api-swagger feature
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"], optional = true }
# Optional emulation dependencies
mockall = { version = "0.13", optional = true }

# Optional SecretStore dependency (`secrets` feature) — zeroizing byte buffers.
# `secrets-openbao` adds no dependency beyond this + reqwest (already unconditional above).
zeroize = { version = "1.7", optional = true }

# Optional OS-native keychain dependency (`secrets-keychain` feature):
# `Entry::get_password`/`set_password`/`delete_credential` over Windows
# Credential Manager / macOS Keychain / Linux Secret Service. Default
# features (keyring's own `v1` feature, on by default) already cover all
# three platforms — Linux goes through `zbus-secret-service-keyring-store`,
# a pure-Rust D-Bus client, so no `libdbus-dev`/`pkg-config` is needed at
# build time. Note: keyring 4.x's own declared `rust-version` (1.88.0) is
# newer than this workspace's baseline (1.83.0) — only consumers who enable
# `secrets-keychain` are affected.
keyring = { version = "4.1", optional = true }

# Optional OpenTelemetry SDK dependencies (enabled via `telemetry` feature)
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace", "metrics"], optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }
# W3C `traceparent` extraction/injection over `http::HeaderMap`. Already in the
# build as a transitive dependency of `opentelemetry-otlp`, so declaring it
# direct adds nothing to the graph — it just lets us name the canonical
# `HeaderExtractor`/`HeaderInjector` instead of re-implementing header casing
# and multi-value rules ourselves.
opentelemetry-http = { version = "0.31", default-features = false, optional = true }

# Postgres access for the `config-service` feature (spec 022). `sqlx-core` +
# `sqlx-postgres` directly — never the `sqlx` facade crate, which pulls a
# MySQL driver path and its transitive `rsa` RUSTSEC advisory into the
# lockfile even when only Postgres is used (this workspace has hit that trap
# before, see `reference_sqlx_facade_audit_landmine`).
#
# TLS: `_tls-rustls-ring-webpki` on `sqlx-core` matches this crate's existing
# TLS stack exactly — `reqwest`'s `rustls-tls` feature (already unconditional
# above) resolves to rustls + the `ring` crypto provider + `webpki-roots`
# (reqwest's `rustls-tls` = `rustls-tls-webpki-roots` = `__rustls-ring` +
# `webpki-roots`), so this avoids linking a second crypto backend
# (`aws-lc-rs`) alongside `ring` in the same binary.
#
# Runtime: `_rt-tokio` — the only async runtime this crate uses anywhere.
#
# `sqlx-postgres`'s own `json` feature (not `sqlx-core/json` directly, though
# it implies that) is what provides `Encode`/`Decode`/`Type` for
# `serde_json::Value` against Postgres `json`/`jsonb` columns — required for
# every table in spec 022's schema.
#
# Neither crate declares a `rust-version` in its own manifest as of 0.8.x
# (unlike sqlx-postgres 0.9, which requires a newer rustc than this
# workspace's pinned toolchain), so 0.8 is also the version-selection
# constraint, not just a default.
#
# `chrono` (both crates): spec 023's `mutation_log.occurred_at` is a
# Postgres `TIMESTAMPTZ` column, decoded as `chrono::DateTime<Utc>` —
# `chrono` is already an unconditional-when-`api-server`-is-on dependency of
# this crate (`config-service` already implies `api-server`), so enabling
# sqlx's own `chrono` feature (which just wires up `Encode`/`Decode` against
# the same crate, the same way its `json` feature already does for
# `serde_json::Value`) adds no new dependency to the graph.
sqlx-core = { version = "0.8", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "chrono"], optional = true }
sqlx-postgres = { version = "0.8", default-features = false, features = ["json", "chrono"], optional = true }

# Administrative bundle export/import (`config-service`, spec 023): plain,
# uncompressed tar — these bundles are small text files (manifests/policies/
# assignments), so compression is not worth a second new dependency
# (`flate2`) alongside this one. No `tar` crate exists anywhere else in this
# workspace.
tar = { version = "0.4", optional = true }

# Windows registry backend for the `config` feature (`ConfigBackend`). Only
# resolved/built when compiling for a Windows target; `config` builds and
# tests cleanly without it everywhere else.
[target.'cfg(windows)'.dependencies]
winreg = { version = "0.55", optional = true }

[dev-dependencies]
# `stream` is needed by tests/integration/api_server_versioning.rs, which calls
# `Response::bytes_stream()` to read the SSE body. Plain `cargo test` compiles
# without it only because another default feature pulls reqwest's `stream` in
# transitively; under `--no-default-features --features auth,testkit` (a combo
# `scripts/run-ci-tests.sh` step 5b runs) that enabler disappears and the test
# target fails to compile. Declared here so the combo stands on its own.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
wiremock = "0.6"
env_logger = "0.11"
log = "0.4"
tempfile = "3.0"
libc = "0.2"
insta = { version = "1", features = ["json"] }
axum = { version = "0.8" }
futures-util = "0.3"
tokio-tungstenite = "0.21"
# Consumers configuring `ApiServerBuilder::cors(...)` supply their own `tower_http::cors::CorsLayer`;
# tests exercise that path the same way a downstream crate would.
tower-http = { version = "0.7", features = ["cors"] }
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "testing"] }
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
testcontainers = "0.27"
# For config-managed tests only: a real TokenProvider (client-credentials
# flow) minting real (test-signed) JWTs against a synthesized wiremock OIDC
# issuer, via the promoted `test-support` helper set (spec 021 testing
# decisions — "this PRD promotes the pattern, not the code").
cli-framework-oidc = { path = "cli-framework-oidc", features = ["client", "server", "test-support"] }
# `OidcFlow::ClientCredentials { client_secret: secrecy::SecretString, .. }` is
# part of cli-framework-oidc's public API, so constructing one from this
# crate's own tests needs the same `secrecy` type directly.
secrecy = { version = "0.8", features = ["serde"] }

[features]
default = ["chat"]
observability = ["dep:tracing-subscriber"]
# `doctor` is implied so telemetry code can produce `DoctorFinding` values
# (e.g. the foreign-subscriber finding) without every consumer separately
# opting into the doctor command surface — `doctor` itself adds no
# dependency (`doctor = []`), so this only widens which types are in scope.
telemetry = ["observability", "config", "doctor", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:opentelemetry-http", "dep:http"]
# CLI output utilities optional features
table-advanced = ["comfy-table"]
progress = ["indicatif"]
# Proc-macro derive support for #[derive(CommandSpec)]
derive = ["dep:cli-framework-macros"]
# Enable CliTestHarness (dev/test use only)
testkit = []
# MCP server — expose registered commands as MCP tools via Streamable HTTP
mcp-server = ["dep:rmcp", "dep:axum", "dep:http"]
# API server — versioned Axum hosting with health/readiness and graceful shutdown
api-server = ["dep:axum", "axum/ws", "dep:tower", "dep:tower-http", "dep:chrono", "dep:tokio-util"]
# MCP install — register this app as an MCP server in agent config files
mcp-install = ["mcp-server", "dep:aikit-sdk"]
# Doctor diagnostics framework — structured health checks with terminal/JSON output
doctor = []
# Project config — project root discovery and TOML loading (off by default)
project-config = []
chat = ["dep:aikit-agent", "dep:tokio-util"]
# Swagger UI / OpenAPI docs — served OpenAPI spec at /api/{version}/openapi.json + embedded Swagger UI at /api/docs
api-swagger = ["api-server", "dep:utoipa-swagger-ui"]
# Emulation support — mock executors and test harnesses for testing CLI behavior
emulation = ["dep:mockall"]
# Authentication — generic TokenProvider + AuthenticatedHttpClient + auth commands
auth = []
# SecretStore — async trait + SecretKey/SecretValue/SecretError + in-memory/env-file backends
secrets = ["dep:zeroize"]
# OpenBao/Vault KV v2 backend (adds nothing beyond `secrets` + reqwest, already unconditional)
secrets-openbao = ["secrets"]
# OS-native keychain backend (Windows Credential Manager / macOS Keychain /
# Linux Secret Service) via the `keyring` crate's default `v1` feature.
secrets-keychain = ["secrets", "dep:keyring"]
# Config — writable ConfigBackend/ConfigStore with atomic file writes, JSON/TOML
# formats, and schema-version migrations. Windows registry backend compiled in
# automatically on Windows targets via `dep:winreg` (a no-op elsewhere).
config = ["dep:winreg"]
# Config manifest + managed client (spec 021) — PolicyClient/RoamingConfigClient
# fetch over HTTP with a bearer token from the existing TokenProvider, so this
# implies both `config` (manifest types, Policy, the resolver) and `auth`
# (TokenProvider, AuthenticatedHttpClient). Adds no new dependency: reqwest is
# already an unconditional dependency of this crate.
config-managed = ["config", "auth"]
# Config service (spec 022) — the server side: a mountable axum router
# serving resolved Policy/manifest/roaming-config over HTTP, backed by
# Postgres (or, for tests/dev, a read-only bundle-directory store). Implies
# `config` (for Policy/ConfigManifest/the resolver — reusable with no cycle
# risk, unlike `cli-framework-oidc`) and `api-server` (axum types, the mount
# seam). Deliberately does NOT imply `config-managed`: the service has no
# need of the *client* (PolicyClient/RoamingConfigClient/auth's TokenProvider)
# it serves. Corrects an initial spec 022 draft's "implies api-server only" —
# that reasoning was specifically about avoiding the cli-framework-oidc
# dependency cycle (a real risk `config-managed` does NOT reopen, since
# `config` has no path back to `cli-framework-oidc`).
config-service = ["config", "api-server", "dep:sqlx-core", "dep:sqlx-postgres", "dep:tar"]

