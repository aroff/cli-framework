path = "tests/integration/telemetry_otlp.rs"
required-features = ["telemetry"]

# Own binary on purpose: `with_telemetry` installs a process-global subscriber,
# so this needs a process where no other test has already claimed one.
[[test]]
name = "integration_telemetry_end_to_end"
path = "tests/integration/telemetry_end_to_end.rs"
required-features = ["telemetry"]

# Own binary for the same process-global-subscriber reason as above. Covers the
# SERVER path (ApiServerBuilder -> serve -> per-request span); the test above
# covers the CLI dispatch path.
[[test]]
name = "integration_telemetry_api_request_span"
path = "tests/integration/telemetry_api_request_span.rs"
required-features = ["telemetry", "api-server"]

# Own binary for the same process-global-subscriber reason as above. Runs TWO
# services in one process and asserts they share a trace id — the acceptance
# criterion for W3C context propagation (spec 020 item 1).
[[test]]
name = "integration_telemetry_context_propagation"
path = "tests/integration/telemetry_context_propagation.rs"
required-features = ["telemetry", "api-server"]

# Own binary for the same reason, and additionally because it sets OTEL_* env
# vars that would leak into any other test sharing the process.
[[test]]
name = "integration_telemetry_otlp_headers"
path = "tests/integration/telemetry_otlp_headers.rs"
required-features = ["telemetry"]

# Own binary for the same process-global-subscriber reason. Asserts the
# `traces_enabled` toggle suppresses trace export WITHOUT taking metrics down.
[[test]]
name = "integration_telemetry_signal_toggles"
path = "tests/integration/telemetry_signal_toggles.rs"
required-features = ["telemetry"]

# Own binary for the same process-global-subscriber reason. Covers the
# built-in `version` short-circuit in `run_with_args` (spec 020 item 6), which
# bypasses `execute_command_direct` and needs its own `cli.command`
# span/metrics wiring.
[[test]]
name = "integration_telemetry_version_command_span"
path = "tests/integration/telemetry_version_command_span.rs"
required-features = ["telemetry"]

