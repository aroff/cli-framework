name = "unit_telemetry_axes"
path = "tests/unit/telemetry_axes.rs"
required-features = ["telemetry"]

[[test]]
name = "unit_telemetry_probe"
path = "tests/unit/telemetry_probe.rs"
required-features = ["telemetry"]

[[test]]
name = "unit_telemetry_probe_catalog"
path = "tests/unit/telemetry_probe_catalog.rs"
required-features = ["telemetry"]

[[test]]
name = "unit_telemetry_policy"
path = "tests/unit/telemetry_policy.rs"
required-features = ["telemetry"]

[[test]]
