# Trait-conformance suite for `PolicyStore`/`UserConfigStore`: FsPolicyStore
# and the in-memory `UserConfigStore` unconditionally, plus the Postgres
# implementations gated on `DATABASE_URL` being set (present in CI via the
# `postgres` service container; absent in ordinary local dev, in which case
# the suite prints why and returns early rather than failing — see the test
# file's module docs). Needs `testkit` for the Postgres seeding/truncate
# helpers under `cli_framework::config::service::postgres::testkit`.
[[test]]
name = "integration_config_service_postgres_conformance"
path = "tests/integration/config_service_postgres_conformance.rs"
required-features = ["config-service", "testkit"]

# ── config-service admin API (spec 023) ──────────────────────────────────────

# `PolicyAdminStore` (PgPolicyStore's write side) exercised directly against a
# real Postgres, same `DATABASE_URL`-presence skip contract as
# `integration_config_service_postgres_conformance`. Needs `testkit` for
# `postgres::testkit` seeding/truncate helpers and for direct pool access
# (proving `mutation_log` has no FK to `policy` by deleting a row with raw
# SQL).
[[test]]
name = "integration_config_service_admin_postgres"
path = "tests/integration/config_service_admin_postgres.rs"
required-features = ["config-service", "testkit"]

# The `/v1/admin/*` HTTP surface end to end: the mounted router (spec 023's
# "mounted router driven in-process" seam), a `TokenIdentity` double standing
# in for the synthesized-OIDC-issuer seam (same precedent
# `config_service_router.rs` already established for spec 022 — see that
# file's own module docs for why a token-in/claims-out double is the right
# level to test *this crate's* auth wiring at), and a real Postgres-backed
# `PolicyAdminStore`/`PolicyStore` pair so admin writes are actually visible
# on the device-facing read path in the same process. `testkit` for seeding
# and pool access, same as the file above.
[[test]]
name = "integration_config_service_admin_router"
path = "tests/integration/config_service_admin_router.rs"
required-features = ["config-service", "testkit"]

