[[test]]
name = "unit_telemetry_subscriber"
path = "tests/unit/telemetry_subscriber.rs"
required-features = ["telemetry"]

# Own binary: installing a subscriber is a process-global one-way door, and
# this test's whole point is the first `try_init` succeeding.
[[test]]
name = "unit_telemetry_subscriber_otel"
path = "tests/unit/telemetry_subscriber_otel.rs"
required-features = ["telemetry"]

[[test]]
name = "unit_telemetry_subscriber_install"
path = "tests/unit/telemetry_subscriber_install.rs"
required-features = ["telemetry"]

# Own binary for the same reason: this test installs a foreign subscriber
# first, so it must not share a process with any test that also installs one.
[[test]]
name = "unit_telemetry_subscriber_foreign"
path = "tests/unit/telemetry_subscriber_foreign.rs"
required-features = ["telemetry"]

# Own binary for the same reason: `init_default_logging` installs a
# subscriber too, and this test calls it twice to see both outcomes.
[[test]]
name = "unit_telemetry_logging_guard"
path = "tests/unit/telemetry_logging_guard.rs"
required-features = ["telemetry"]

# Own binary: this file mutates the process-global panic hook
# (std::panic::set_hook/take_hook), and every test in it does so. They are
# serialized by hand within the one binary (see the file's module doc) since
# `serial_test` is not a dev-dependency of this crate.
[[test]]
name = "unit_telemetry_panic"
path = "tests/unit/telemetry_panic.rs"
required-features = ["telemetry"]

# Pins the fixed telemetry startup order (Task 16). No process-global state,
# so unlike the other telemetry test binaries above this one needs no
# serialization discipline — it is its own `[[test]]` target only to follow
# this crate's established one-binary-per-telemetry-surface convention.
[[test]]
name = "unit_telemetry_ci_targets"
path = "tests/unit/telemetry_ci_targets.rs"
required-features = ["telemetry"]

[[test]]
name = "unit_telemetry_startup_order"
path = "tests/unit/telemetry_startup_order.rs"
required-features = ["telemetry"]
