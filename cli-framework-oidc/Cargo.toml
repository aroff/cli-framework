[package]
name = "cli-framework-oidc"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
description = "OIDC/OAuth2 provider for cli-framework"
license = "Apache-2.0"

[features]
default = []
# Re-export of cli-framework's SecretStore capability, so the token cache
# (see src/client/cache.rs) can be routed through it. `client` always pulls
# this in — the cache is unconditionally SecretStore-backed — but it's named
# separately so callers can see it as a discrete, additive capability.
secrets = ["cli-framework/secrets"]
client = [
    "secrets",
    "cli-framework/auth",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:secrecy",
    "dep:fs2",
    "dep:open",
    "dep:time",
    "dep:sha2",
    "dep:base64",
    # PKCE verifier/state entropy. Shared with `browser` via `crate::pkce`; the
    # device-code flow needs it too, so it is no longer browser-only.
    "dep:rand",
    "dep:dirs",
]
server = [
    "cli-framework/api-server",
    "dep:jsonwebtoken",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:time",
    "dep:tower",
]
browser = [
    "cli-framework/api-server",
    "dep:jsonwebtoken",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:time",
    "dep:tower",
    "dep:sha2",
    "dep:base64",
    "dep:aes-gcm",
    "dep:zeroize",
    "dep:rand",
    "dep:hmac",
    "dep:hkdf",
]
# Test-support: promotes the synthesized-OIDC-issuer helper set (runtime P-256
# keys, minted JWTs, wiremock discovery+JWKS) that `tests/server_validation.rs`
# used to keep as private copies, exposing them as `#[doc(hidden)] pub`
# functions in `src/test_support.rs` (spec 021 testing decisions). Both this
# crate's own tests and downstream crates' tests (see `cli-framework`'s
# `config-managed` tests) depend on it. Implies `server` for
# `OidcValidationConfig`/`AudiencePolicy`, and adds `dep:rcgen` (previously
# dev-only) since generated code here runs as part of the library, not a test
# binary.
test-support = ["server", "dep:rcgen", "dep:base64"]

[dependencies]
cli-framework = { path = "..", default-features = false }
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
url = { version = "2" }

# client feature deps
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
secrecy = { version = "0.8", features = ["serde"], optional = true }
fs2 = { version = "0.4", optional = true }
open = { version = "5", optional = true }
time = { version = "0.3", features = ["formatting", "parsing", "serde"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
dirs = { version = "5", optional = true }

# server feature deps
jsonwebtoken = { version = "9", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }

# browser feature deps
aes-gcm = { version = "0.10", optional = true }
zeroize = { version = "1.7", features = ["derive"], optional = true }
rand = { version = "0.8", optional = true }
hmac = { version = "0.12", optional = true }
hkdf = { version = "0.12", optional = true }

# test-support feature deps — P-256 key generation for minting test JWTs.
# `base64`/`jsonwebtoken` are already optional deps above (client/server).
rcgen = { version = "0.13", optional = true }

[[example]]
name = "keycloak_cli"
path = "examples/keycloak_cli.rs"
required-features = ["client"]

[[test]]
name = "config_validation"
path = "tests/config_validation.rs"

[[test]]
name = "client_cache"
path = "tests/client_cache.rs"
required-features = ["client"]

[[test]]
name = "client_flows"
path = "tests/client_flows.rs"
required-features = ["client"]

[[test]]
name = "server_validation"
path = "tests/server_validation.rs"
required-features = ["server", "test-support"]

[[test]]
name = "browser_validation"
path = "tests/browser_validation.rs"
required-features = ["browser"]

[dev-dependencies]
tokio = { version = "1.52", features = ["full"] }
wiremock = "0.6"
tempfile = "3.0"
serde_json = "1.0"
rcgen = "0.13"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
axum = { version = "0.8" }
tower = { version = "0.5", features = ["util"] }
