[package]
name = "cli-framework-oidc"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
description = "OIDC/OAuth2 provider for cli-framework"
license = "Apache-2.0"

[features]
default = []
client = [
    "cli-framework/auth",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:secrecy",
    "dep:fs2",
    "dep:open",
    "dep:time",
    "dep:sha2",
    "dep:base64",
    "dep:dirs",
]
server = [
    "cli-framework/api-server",
    "dep:jsonwebtoken",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:time",
    "dep:tower",
]
browser = [
    "cli-framework/api-server",
    "dep:jsonwebtoken",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:time",
    "dep:tower",
    "dep:sha2",
    "dep:base64",
    "dep:aes-gcm",
    "dep:zeroize",
    "dep:rand",
    "dep:hmac",
    "dep:hkdf",
]

[dependencies]
cli-framework = { path = "..", default-features = false }
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
url = { version = "2" }

# client feature deps
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
secrecy = { version = "0.8", features = ["serde"], optional = true }
fs2 = { version = "0.4", optional = true }
open = { version = "5", optional = true }
time = { version = "0.3", features = ["formatting", "parsing", "serde"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
dirs = { version = "5", optional = true }

# server feature deps
jsonwebtoken = { version = "9", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }

# browser feature deps
aes-gcm = { version = "0.10", optional = true }
zeroize = { version = "1.7", features = ["derive"], optional = true }
rand = { version = "0.8", optional = true }
hmac = { version = "0.12", optional = true }
hkdf = { version = "0.12", optional = true }

[[example]]
name = "keycloak_cli"
path = "examples/keycloak_cli.rs"
required-features = ["client"]

[[test]]
name = "config_validation"
path = "tests/config_validation.rs"

[[test]]
name = "client_cache"
path = "tests/client_cache.rs"
required-features = ["client"]

[[test]]
name = "client_flows"
path = "tests/client_flows.rs"
required-features = ["client"]

[[test]]
name = "server_validation"
path = "tests/server_validation.rs"
required-features = ["server"]

[[test]]
name = "browser_validation"
path = "tests/browser_validation.rs"
required-features = ["browser"]

[dev-dependencies]
tokio = { version = "1.52", features = ["full"] }
wiremock = "0.6"
tempfile = "3.0"
serde_json = "1.0"
rcgen = "0.13"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
axum = { version = "0.8" }
tower = { version = "0.5", features = ["util"] }
