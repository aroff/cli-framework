[package]
name = "cli-framework-oidc"
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
description = "OIDC/OAuth2 provider for cli-framework"
license = "Apache-2.0"

[features]
default = []
client = [
    "cli-framework/auth",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:secrecy",
    "dep:fs2",
    "dep:open",
    "dep:time",
    "dep:sha2",
    "dep:base64",
]
server = [
    "cli-framework/api-server",
    "dep:jsonwebtoken",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:time",
    "dep:tower",
]

[dependencies]
cli-framework = { path = "..", default-features = false }
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
url = { version = "2" }

# client feature deps
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
secrecy = { version = "0.8", features = ["serde"], optional = true }
fs2 = { version = "0.4", optional = true }
open = { version = "5", optional = true }
time = { version = "0.3", features = ["formatting", "parsing", "serde"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

# server feature deps
jsonwebtoken = { version = "9", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["full"] }
wiremock = "0.6"
tempfile = "3.0"
serde_json = "1.0"
